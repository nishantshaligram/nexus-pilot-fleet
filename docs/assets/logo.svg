<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="fleetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <filter id="fleetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="128" height="128" rx="28" fill="#0A0E17"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#fleetGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Multi-Agent Fleet Chevron Armada -->
  <g filter="url(#fleetGlow)">
    <!-- Flagship Lead (Center-Top) -->
    <polygon points="64,22 76,46 64,40 52,46" fill="#00FFA3" stroke="#00FFA3" stroke-width="1.5"/>
    
    <!-- Wingman 1 (Left) -->
    <polygon points="34,54 44,74 34,69 24,74" fill="#00D2FF" stroke="#00D2FF" stroke-width="1.5"/>
    
    <!-- Wingman 2 (Right) -->
    <polygon points="94,54 104,74 94,69 84,74" fill="#00D2FF" stroke="#00D2FF" stroke-width="1.5"/>

    <!-- Support Vessel 1 (Rear Left) -->
    <polygon points="46,84 54,100 46,96 38,100" fill="#7928CA" stroke="#7928CA" stroke-width="1.5"/>

    <!-- Support Vessel 2 (Rear Right) -->
    <polygon points="82,84 90,100 82,96 74,100" fill="#7928CA" stroke="#7928CA" stroke-width="1.5"/>

    <!-- Formation Network Energy Grid -->
    <line x1="64" y1="40" x2="34" y2="54" stroke="url(#fleetGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <line x1="64" y1="40" x2="94" y2="54" stroke="url(#fleetGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <line x1="34" y1="69" x2="46" y2="84" stroke="url(#fleetGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <line x1="94" y1="69" x2="82" y2="84" stroke="url(#fleetGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
    <line x1="46" y1="96" x2="82" y2="96" stroke="url(#fleetGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  </g>
</svg>
